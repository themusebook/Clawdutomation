[package]
name = "openclawd-solana-kit"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Solana/EVM agent kit: signers, tools, reasoning loop, and optional HTTP service"
documentation = "docs/"
default-run = "kit"

[lib]
name = "openclawd_solana_kit"
path = "src/lib.rs"

[[bin]]
name = "kit"
path = "src/bin/kit.rs"
required-features = ["http"]

[[example]]
name = "simple"
required-features = ["solana"]

[[example]]
name = "solana_agent"
required-features = ["solana"]

[features]
default = ["solana"]
solana = [
  "dep:solana-account-decoder",
  "dep:solana-sdk",
  "dep:spl-token",
  "dep:spl-token-2022",
  "dep:solana-client",
  "dep:solana-transaction-status",
  "dep:spl-associated-token-account",
  "dep:blockhash-cache",
  "dep:borsh",
]
evm = [
  "dep:alloy",
  "dep:alloy-primitives",
  "dep:uniswap-v3-sdk",
  "dep:uniswap-sdk-core",
]
http = [
  "dep:actix-web",
  "dep:actix-cors",
  "dep:actix-web-lab",
  "dep:actix-files",
  "dep:tokio-stream",
  "dep:jsonwebtoken",
  "dep:redis",
  "dep:privy",
]
cross-chain = ["solana", "evm", "dep:evm-approvals"]
full = ["http", "solana", "evm", "cross-chain"]

[dependencies]
# Core
env_logger = "0.11"
log = "0.4"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
bincode = "1.3"
base64 = "0.22"
# Pin below 1.0.220: serde_core split removes serde::__private used by older alloy
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "1.0"
rand = "0.10"
chrono = "0.4"
dotenv = "0.15"
hex = "0.4"
timed = "0.2"
ureq = "2"
anyhow = "1.0"
thiserror = "2.0"
once_cell = "1.20"
tokio = { version = "1.37", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
serde_with = "3"
async-trait = "0.1"
ctor = "0.2"
futures-util = "0.3"

# LLM / tools (package rig-core, lib name `rig`)
rig-core = "0.9"
rig-tool-macro = "0.4"

# Solana (feature-gated)
solana-account-decoder = { version = "2.1.9", optional = true }
solana-sdk = { version = "2.1.9", optional = true }
spl-token = { version = "7.0.0", optional = true }
spl-token-2022 = { version = "7.0.0", optional = true }
solana-client = { version = "2.1.9", optional = true }
solana-transaction-status = { version = "2.1.9", optional = true }
spl-associated-token-account = { version = "6.0.0", optional = true }
blockhash-cache = { version = "0.1", optional = true }
borsh = { version = "1.5", optional = true }

# EVM (feature-gated)
alloy = { version = "=0.9.2", features = ["full"], optional = true }
# Force 0.8.x: uniswap-sdk-core's ">=0.8.5" otherwise resolves to 1.x and dual-versions break alloy 0.9
alloy-primitives = { version = "=0.8.26", features = ["map-fxhash"], optional = true }
# Pin to 3.3.x stack (matches alloy 0.9 / primitives 0.8)
uniswap-v3-sdk = { version = "=3.3.0", features = ["extensions", "std"], optional = true }
uniswap-sdk-core = { version = "=3.3.0", optional = true }
evm-approvals = { version = "0.1", optional = true }

# HTTP / wallet service (feature-gated)
privy = { version = "0.9", optional = true }
actix-web = { version = "4", optional = true }
actix-cors = { version = "0.6", optional = true }
actix-web-lab = { version = "0.24", optional = true }
actix-files = { version = "0.6", optional = true }
tokio-stream = { version = "0.1", optional = true }
jsonwebtoken = { version = "10.2", optional = true }
redis = { version = "0.28", features = ["tokio-comp"], optional = true }

[dev-dependencies]
tokio = { version = "1.37", features = ["full", "macros", "rt-multi-thread"] }
serde_json = "1.0"
